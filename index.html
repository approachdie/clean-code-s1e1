<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="hero">
      <img src="./eisenhower-matrix.jpg" alt="matrix">
      <a class="hero__link" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </div>
    <div class="content">
      <p class="add">
        <label class="add__label" for="new-task">Add Item</label>
      </p>
      <div class="content__wrapper">
        <input class="task" id="new-task" type="text">
        <button>Add</button>
      </div>
      <h3>Todo</h3>
        <ul id="incompleteTasks">
          <li class="content__item">
            <input class="check" type="checkbox">
            <label class="task__label">Pay Bills</label>
            <input class="task" type="text">
            <button class="edit">Edit</button>
            <button class="delete">
              <img src="./remove.svg" alt="remove">
            </button>
          </li>
          <li class="content__item editMode">
            <input type="checkbox">
            <label class="task__label">Go Shopping</label>
            <input class="task" type="text" value="Go Shopping">
            <button class="edit">Save</button>
            <button class="delete">
              <img src="./remove.svg" alt="remove">
            </button>
          </li>
        </ul>
        <h3>Completed</h3>
        <ul id="completed-tasks">
          <li class="content__item">
            <input type="checkbox" checked>
            <label class="task__label">See the Doctor</label>
            <input class="task" type="text">
            <button class="edit">Edit</button>
            <button class="delete">
              <img src="./remove.svg" alt="remove">
            </button>
          </li>
        </ul>
    </div>
    <script src="app.js"></script>
  </body>
</html>
